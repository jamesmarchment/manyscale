<head>
<style>
.repo-card {
  font-family: "Montserrat", sans-serif;
  background: #f5f5f0;
  border: 5px solid #0a0a0a;
  position: relative;
  overflow: hidden;
  width: 360px;
  transform: scale(0.8);
}

.repo-photo {
  height: 38px;
  background: #f5e642;
  border-bottom: 5px solid #0a0a0a;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
}
.repo-photo::before {
  content: "";
  position: absolute;
  inset: 0;
 
}
.repo-photo-num {
  font-family: "Montserrat", sans-serif;
  font-size: 3rem;
  line-height: 0.85;
  color: rgba(0, 0, 0, 0.08);
  position: absolute;
  right: -8px;
  bottom: 0px;
  letter-spacing: -0.02em;
  pointer-events: none;
}

.repo-flag {
  position: absolute;
  top: 6px;
  right: 14px;
  z-index: 2;
  background: #00e060;
  border: 3px solid #0a0a0a;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  padding: 3px 8px;
  text-transform: uppercase;
}


.repo-body {
  padding: 16px 18px 0;
}
.repo-handle {
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  color: #6a6a6a;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.repo-name {
  font-family: "Montserrat", sans-serif;
  font-weight: 500;
  font-size: 2.75rem;
  line-height: 0.88;
  color: #0a0a0a;
  letter-spacing: -0.01em;
  margin-bottom: 14px;
}
.repo-bio {
  font-size: 0.9rem;
  font-weight: 500;
  color: #0a0a0a;
  border-left: 5px solid #e8180a;
  padding-left: 10px;
  line-height: 1.55;
  margin-bottom: 14px;
}

.repo-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  border-top: 3px solid #0a0a0a;
}
.card-stat {
  padding: 12px 10px;
  border-right: 3px solid #0a0a0a;
  text-align: center;
}
.card-stat:last-child {
  border-right: none;
}
.card-stat .repo-value {
  font-family: "Montserrat", sans-serif;
  font-size: 1.8rem;
  line-height: 1;
  color: #0a0a0a;
  display: block;
}
.card-stat .repo-label {
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: #a8a49a;
  text-transform: uppercase;
  display: block;
  margin-top: 2px;
}

.repo-btn {
  display: block;
  width: 100%;
  padding: 13px;
  background: #0a0a0a;
  color: #f5e642;
  border: none;
  border-top: 5px solid #0a0a0a;
  font-family: "Montserrat", sans-serif;
  font-size: 1.1rem;
  letter-spacing: 0.2em;
  cursor: pointer;
  text-align: center;
  transition:
    background 0.15s,
    color 0.15s;
}
.repo-btn:hover {
  background: #f5e642;
  color: #0a0a0a;
}

.card {
  anchor-name: --card;
  anchor-scope: --card;
  }

.primary-link {
text-decoration: none; 
color: inherit;}

.primary-link::after {
   content: '';
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 1; /* Less than the inner interactive elements */
  pointer-events: auto; 
  }

</style>
</head>
<body>
<div class="repo-card card">
  <div class="repo-photo">
    <div class="repo-flag">NEW</div>
   
  </div>

  <div class="repo-body">
    <div class="repo-handle">Relationship Science</div>
    <div class="repo-name">
    <a class="primary-link" href="#">RelaScale</a></div>
    <div class="repo-bio">
      Satisfaction, Relationship Quality, Communication, Love, Trust
    </div>
  </div>

  <div class="repo-stats">
    <div class="card-stat">
      <span class="repo-value">45</span>
      <span class="repo-label">Measures</span>
    </div>
    <div class="card-stat">
      <span class="repo-value">47</span>
      <span class="repo-label">Constructs</span>
    </div>
    <div class="card-stat">
      <span class="repo-value">7</span>
      <span class="repo-label">Translations</span>
    </div>
  </div>


</div>
</body>
